# NOTE: you may need to pin `crc = { version = "=3.3.0" }` if you keep running into errors on upgrades 
# The issue is that lzma-rust2 v15.4.0 mandated crc 3.3.0 precise, but sqlx keeps updating it to 3.4.0

[workspace]
members = ["audit", "audit_macro"]
resolver = "3"

[workspace.dependencies]
audit_macro = { path = "./audit_macro", version = "0.1.0" }
axum = { version = "0.8.8" }
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
axum-login = "0.18.0"
axum-macros = { version = "0.5.0" }
base64ct = { version = "1.8.3", features = ["alloc"] }
quote = "1.0.43"
syn = "2.0.114"
# TODO: switch to jiff https://github.com/BurntSushi/jiff
chrono = { version = "0.4.42", features = ["serde"] }
console_error_panic_hook = "0.1.7"
dotenvy = "0.15.7"
futures = "0.3.31"
garde = { version = "0.22.1", features = ["derive", "email"] }
http = "1.4.0"
leptos = { version = "0.8.15", features = ["nightly"] }
leptos_axum = { version = "0.8.7" }
leptos_meta = { version = "0.8.5" }
leptos_router = { version = "0.8.11", features = ["nightly"] }
mailgun-rs = { version = "2.0.1" }
# TODO: switch to pulldown-cmark https://github.com/pulldown-cmark/pulldown-cmark/
markdown = "1.0.0"
oauth2 = "5.0.0"
plotly = { version = "0.14.0", features = ["static_export_default"] }
proc-macro2 = "1.0.105"
rand = { version = "0.9.2" }
reactive_stores = "0.3.1"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10.9", default-features = false }

sqlx = { version = "0.8.6", features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
] }

thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = { version = "0.1.44" }
uuid = { version = "1.19.0", features = ["serde"] }
wasm-bindgen = "0.2.106"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
codegen-units = 1
inherits = "release"
lto = true
opt-level = 'z'
panic = "abort"
